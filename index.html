<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
    <div class="header">
        <h2>Anoop Kumar</h2>
        <button   class="toggle-modal">Add New Task</button>
    </div>
   </header>
   <main>
<section class="board " id="todo">
    <div class="">

        <div class="heading">
            <div class="left">To Do</div>
            <div class="right">Count:</div>
        </div>
        <div class="task-coloumn " >
            
        </div>
    </div>
  
</section>
    <section class="board"id="progress">
         <div class="heading">
        <div class="left">In Progress</div>
        <div class="right">Count:</div>
        </div>
         <div class="task-coloumn" >
  
    </div>
    </section>
    <section class="board" id="done">
         <div class="heading">
        <div class="left">Done</div>
        <div class="right">Count:</div>
        </div>
         <div class="task-coloumn" >
 
    </div>
    </section>
   </main>
   <div class="modal add-new-btn" >
    <div class="bg"></div>
    <div class="center">
        <input type="text" placeholder="Task Title" class="textinp">
        <textarea placeholder="Task Description" class="taskinfo"></textarea>
        <button id="add-new-task"
        class="add-task-btn">Add Task</button>
    </div>
   </div>
  <script src="script.js"></script>  
</body>
</html>
