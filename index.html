<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
    <div class="header">
        <h2>Anoop Kumar</h2>
        <button>Add New Task</button>
    </div>
   </header>
   <main>
<section class="board">
        <div class="heading">
        <div class="left">To Do</div>
        <div class="right">Count:</div>
    </div>
    <div class="task-coloumn hover-over" id="todo">
 
    </div>
  
</section>
    <section class="board">
         <div class="heading">
        <div class="left">In Progress</div>
        <div class="right">Count:</div>
        </div>
         <div class="task-coloumn" id="progress">
  
    </div>
    </section>
    <section class="board">
         <div class="heading">
        <div class="left">Done</div>
        <div class="right">Count:</div>
        </div>
         <div class="task-coloumn" id="done">
 
    </div>
    </section>
   </main>
  <script src="script.js"></script>  
</body>
</html>
